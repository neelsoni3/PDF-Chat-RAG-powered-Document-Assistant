<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app" id="app">
    <!-- ============ Sidebar ============ -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-inner">
        <header class="sidebar-header">
          <div class="brand">
            <div class="brand-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
              </svg>
            </div>
            <div>
              <div class="brand-name">PDF Chat</div>
              <div class="brand-sub">Document assistant</div>
            </div>
          </div>
          <button class="icon-btn" id="closeSidebar" aria-label="Close sidebar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </header>

        <div class="sidebar-body">
          <div class="section">
            <div class="section-label">Upload</div>
            <label class="upload-zone" for="fileInput" id="uploadZone">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="17 8 12 3 7 8"/>
                <line x1="12" y1="3" x2="12" y2="15"/>
              </svg>
              <span>Click or drop PDF</span>
            </label>
            <input type="file" id="fileInput" accept=".pdf,application/pdf" multiple hidden>
          </div>

          <div class="section">
            <div class="section-label">
              <span>Documents</span>
              <span class="doc-count" id="docCount">0</span>
            </div>
            <ul class="doc-list" id="docList">
              <li class="empty">No documents yet</li>
            </ul>
          </div>
        </div>

        <footer class="sidebar-footer">
          <button class="btn btn-ghost btn-full" id="clearBtn" disabled>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            </svg>
            Clear all
          </button>
        </footer>
      </div>
    </aside>

    <div class="backdrop" id="backdrop"></div>

    <!-- ============ Main ============ -->
    <main class="main">
      <header class="main-header">
        <button class="icon-btn" id="openSidebar" aria-label="Open sidebar" aria-expanded="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <div class="header-title">
          <h1>Chat</h1>
          <p>Ask questions about your documents</p>
        </div>
        <div class="header-status" id="status"></div>
      </header>

      <div class="chat-area" id="chatArea">
        <div class="empty-state" id="emptyState">
          <div class="empty-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
          </div>
          <h2>Start a conversation</h2>
          <p>Upload a PDF and ask anything about it.</p>
        </div>
        <div class="messages" id="messages"></div>
      </div>

      <form class="composer" id="composer">
        <div class="composer-inner">
          <textarea
            id="questionInput"
            placeholder="Ask a question..."
            rows="1"
            aria-label="Question"
          ></textarea>
          <button type="submit" class="send-btn" id="sendBtn" disabled aria-label="Send">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </div>
        <div class="composer-hint">Enter to send &middot; Shift+Enter for new line</div>
      </form>
    </main>
  </div>

  <div class="drop-overlay" id="dropOverlay">
    <div class="drop-overlay-content">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      <p>Drop PDF files to upload</p>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
